/* tab bar */

.extras { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

/* pack tiles */
.packs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.pack { background: var(--bg-grouped); border-radius: 14px; padding: 14px; text-align: left; display: flex; flex-direction: column; gap: 8px; min-height: 124px; position: relative; }
.pack .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; }

.book { width: 116px; flex: none; text-align: left; display: block; }
.book.off { opacity: .5; }
.cover { aspect-ratio: 2 / 3; width: 100%; max-width: 100%; border-radius: 3px 6px 6px 3px; overflow: hidden; position: relative; box-shadow: 0 1px 2px rgba(0,0,0,.15), 0 6px 16px rgba(0,0,0,.18); display: flex; flex-direction: column; justify-content: space-between; padding: 14% 10%; color: #fff; }
.cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,.18) 0, rgba(255,255,255,.18) 2.5%, rgba(0,0,0,.05) 5%, transparent 9%); pointer-events: none; }
.cover .ce { font-size: 20px; line-height: 1; margin-bottom: 8px; }

.cover .ca { margin-top: auto; }
.cover.big .ct { font-size: 17px; }

.hair span { display: block; height: 100%; background: var(--tint-fill); }
.hero-book { display: flex; gap: 16px; align-items: flex-end; padding: 4px 0 6px; }
.hero-meta { min-width: 0; padding-bottom: 4px; }
.hero-meta .kicker { font-size: 12px; font-weight: 600; color: var(--label-2); text-transform: uppercase; letter-spacing: .3px; }
.hero-meta h3 { font: 600 22px/1.2 var(--serif-ui); margin: 4px 0 2px; }
.hero-meta .author { color: var(--label-2); font-size: 14px; }
.hero-btns { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.list-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.lh-btns { display: flex; gap: 14px; }
.plain { border-top: .5px solid var(--sep); }
.plain .srow { padding: 12px 0; gap: 12px; }

.plain .srow { border-bottom: .5px solid var(--sep); }
.plain .srow .txt { text-align: left; }
.plain .more { justify-content: center; color: var(--label-3); font-size: 14px; }
.plain .add-row { border-bottom: 0; }
.say-btn { width: 34px; height: 34px; border-radius: 50%; background: var(--fill); color: var(--tint); display: grid; place-items: center; flex: none; transition: transform .15s, background .15s; }
.say-btn svg { width: 17px; height: 17px; }
.say-btn.playing { background: var(--tint-fill); color: var(--on-tint); animation: pulse 1s ease-in-out infinite; }
.srow.now .it { color: var(--tint); }
@keyframes pulse { 50% { transform: scale(1.08); } }

/* prototype bar: deliberately unlike the app */
#proto { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 66px); display: flex; align-items: center; gap: 4px; background: var(--proto-bg); color: var(--proto-fg); border-radius: 99px; padding: 5px 8px; box-shadow: 0 6px 24px rgba(0,0,0,.35); font: 600 13px var(--sans); white-space: nowrap; max-width: calc(100% - 24px); }

#toast { position: fixed; z-index: 70; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 118px); background: var(--proto-bg); color: var(--proto-fg); padding: 9px 16px; border-radius: 99px; font-size: 14px; box-shadow: var(--shadow); max-width: calc(100% - 32px); text-align: center; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  <main id="view" class="view"></main>
  <nav id="tabbar" aria-label="Sections"></nav>
</div>

<div id="scrim" hidden></div>
<div id="sheet" hidden></div>
<div id="proto" role="toolbar" aria-label="Prototype controls"></div>
<div id="toast" hidden></div>

<script>
const I = {
  listen: '<path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4.5" height="6.5" rx="1.5"/><rect x="16.5" y="14" width="4.5" height="6.5" rx="1.5"/>',
  shadow: '<path d="M3 12h3l2-5 3 10 2.5-7 1.5 2h6"/>',
  say: '<path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v9a1.5 1.5 0 0 1-1.5 1.5H10l-4.5 4v-4h0A1.5 1.5 0 0 1 4 14.5z"/><path d="M8.5 9h7M8.5 12h4.5"/>',
  words: '<rect x="4" y="6" width="13" height="14" rx="2"/><path d="M8 3h10a2 2 0 0 1 2 2v12"/><path d="M8 16l2.5-6 2.5 6M8.8 14.2h3.4"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  close: '<path d="M6 6l12 12M18 6L6 18"/>',
  back: '<path d="M15 5l-7 7 7 7"/>',
  chev: '<path d="M9 5l7 7-7 7"/>',
  play: '<path d="M7 4.5v15l13-7.5z"/>',
  speaker: '<path d="M4 9.5h3.5L12 5v14l-4.5-4.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>',
  slow: '<path d="M4 16c0-4 3.5-7 8-7s8 3 8 7z"/><path d="M8 16v3M16 16v3M20 13l1.5-1"/>',
  pause: '<path d="M9 5v14M15 5v14"/>',
  edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  trash: '<path d="M5 7h14M10 7V4.5h4V7M7 7l1 13h8l1-13"/>',
  eye: '<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/>',
  more: '<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>',
  star: '<path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8-4.3-4.1 5.9-.8z"/>',
  folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  bulb: '<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>',
  undo: '<path d="M9 7L4.5 11.5 9 16"/><path d="M5 11.5h9.5a5 5 0 0 1 0 10H12"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>',
  book: '<path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H10a3 3 0 0 1 2 .8A3 3 0 0 1 14 3h4.5A1.5 1.5 0 0 1 20 4.5v13a1.5 1.5 0 0 1-1.5 1.5H14a2 2 0 0 0-2 2 2 2 0 0 0-2-2H5.5A1.5 1.5 0 0 1 4 17.5z"/>',
};
const svg = k => `<svg viewBox="0 0 24 24" aria-hidden="true">${I[k]}</svg>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const gender = s => s.replace(/\{(\w+)\|(\w+)\}/g, '$1');

const PLAN = [
  { k: 'listen', name: 'Listen', n: 4, min: 2, what: 'sentences', how: 'Hear each sentence, then reveal it. Warms up your ear.' },
  { k: 'shadow', name: 'Shadow', n: 4, min: 3, what: 'sentences × 3', how: 'Listen, then repeat it aloud straight after. Three times each.' },
  { k: 'say', name: 'Say it', n: 8, min: 5, what: 'sentences', how: 'See the English, say the Italian out loud, then check.' },
];
const WORDS = { k: 'words', name: 'Words', n: 10, min: 2, what: 'gems', how: 'Bonus: your saved words, as in reviews now.' };

/* Sentences live once; packs point at them (sentence.packs works like book.collections). */
const SENT = {};
let sid = 0;
function S_(it, en, packs, lvl = 0, extra = {}) { const id = 's' + (++sid); SENT[id] = { id, it, en, packs, lvl, ...extra }; return id; }
const PACKS = [
  { id: 'reading', name: 'From reading', emoji: '📖', col: '#5b6b7a', own: true, auto: true },
  { id: 'home', name: 'At home', emoji: '🏠', col: '#e5484d', own: true },
  { id: 'rome', name: 'Weekend in Rome', emoji: '✈️', col: '#2585ea', own: true },
  { id: 'survival', name: 'Survival', emoji: '🧭', col: '#1aa57a', on: true },
  { id: 'partner', name: 'Partner: everyday', emoji: '💬', col: '#c2577e', on: true },
  { id: 'partner2', name: 'Partner: plans & errands', emoji: '🗓️', col: '#a3477a', on: false },
  { id: 'cafe', name: 'Café & restaurant', emoji: '☕', col: '#b8740f', on: true },
  { id: 'directions', name: 'Directions', emoji: '🗺️', col: '#3a7bd5', on: false },
  { id: 'shopping', name: 'Shopping', emoji: '🛍️', col: '#7e5fe0', on: false },
  { id: 'smalltalk', name: 'Small talk', emoji: '👋', col: '#0f8f8a', on: false },
];
S_('Il primo della giornata è sempre il migliore.', 'The first one of the day is always the best.', ['reading'], 1, { src: 'Un caffè a Bologna · Ch. 1' });
S_('Non aveva fretta.', 'She wasn’t in a hurry.', ['reading'], 0, { src: 'Un caffè a Bologna · Ch. 1' });
S_('Guarda tutto come se fosse un film.', 'She looks at everything as if it were a film.', ['reading'], 0, { src: 'Un caffè a Bologna · Ch. 1' });
S_('Tocca a te portare fuori il cane.', 'It’s your turn to take the dog out.', ['home', 'partner'], 2);
S_('Mi manchi quando sei via.', 'I miss you when you’re away.', ['home'], 1);
S_('Hai visto le mie chiavi?', 'Have you seen my keys?', ['home'], 3);
S_('Stasera cucino io.', 'I’ll cook tonight.', ['home', 'partner'], 0, { paused: true });
S_('Ho prenotato un tavolo per le otto.', 'I’ve booked a table for eight.', ['rome', 'cafe'], 3);
S_('Quanto ci vuole a piedi?', 'How long does it take on foot?', ['rome'], 0);
S_('Non ho capito, può ripetere?', 'I didn’t understand, could you repeat that?', ['survival'], 4);
S_('Parli più piano, per favore.', 'Please speak more slowly.', ['survival'], 3);
S_('Come si dice in italiano?', 'How do you say it in Italian?', ['survival'], 2);
S_('Cosa vuoi per cena?', 'What do you want for dinner?', ['partner'], 1);
S_('A che ora torni stasera?', 'What time are you coming home tonight?', ['partner'], 0);
S_('Sei stanc{o|a}?', 'Are you tired?', ['partner'], 2);
S_('Com’è andata la giornata?', 'How was your day?', ['partner'], 3);
S_('Come ci andiamo?', 'How shall we get there?', ['partner2'], 0);
S_('Hai comprato il latte?', 'Did you buy the milk?', ['partner2'], 0);
S_('Il conto, per favore.', 'The bill, please.', ['cafe'], 4);
S_('È lontano da qui?', 'Is it far from here?', ['directions'], 0);
S_('Quanto costa questo?', 'How much is this?', ['shopping'], 0);
S_('Di dove sei?', 'Where are you from?', ['smalltalk'], 0);
const TOTALS = { survival: 30, partner: 30, partner2: 30, cafe: 30, directions: 25, shopping: 25, smalltalk: 30 };
const packSents = id => Object.values(SENT).filter(s => s.packs.includes(id));
const packTotal = p => TOTALS[p.id] || packSents(p.id).length;
const packLearned = p => p.id in TOTALS ? Math.round(packSents(p.id).filter(s => s.lvl >= 2).length / packSents(p.id).length * (p.on ? TOTALS[p.id] * .6 : 0)) : packSents(p.id).filter(s => s.lvl >= 3).length;
const packOn = p => p.own || p.on;

const STATUS = { cena: 1, fermata: 1, brioche: 0, crema: 0, torni: 0, davanti: 1, cucino: 0 };
const GLOSS = { cena: 'dinner', fermata: 'stop (bus, tram)', brioche: 'croissant-style pastry', crema: 'custard', torni: 'you come back', davanti: 'in front', cucino: 'I cook' };

const S = { progress: 'fresh', page: null, showEN: false, focus: 'partner', bonusOn: false };
const PROGRESS = { fresh: 'Not started', half: 'Halfway', done: 'All done' };
const stepsDone = () => S.progress === 'done' ? 3 : S.progress === 'half' ? 1 : 0;
const minsLeft = () => PLAN.slice(stepsDone()).reduce((a, p) => a + p.min, 0);

function ringSVG(frac, r = 28, sw = 6) {
  const c = 2 * Math.PI * r, size = (r + sw) * 2;
  return `<svg class="r" viewBox="0 0 ${size} ${size}"><circle class="track" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${sw}"/><circle class="prog" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${sw}" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - frac)}"/></svg>`;
}
const lvlDots = s => s.lvl === 0 ? '<span class="lvl new">NEW</span>' : `<span class="lvl" aria-label="level ${s.lvl} of 4">${[1,2,3,4].map(i => `<i class="${i <= s.lvl ? 'on' : ''}"></i>`).join('')}</span>`;
const emb = (p, size) => `<span class="emb" style="background:${p.col}">${esc(p.emoji)}</span>`;

/* ---------- Training tab ---------- */
function bonusRow() {
  return `<button class="bonus" data-act="bonus"><span class="ico">${svg('words')}</span><span class="t"><div>Bonus: ${WORDS.n} words</div><small>Your gems, if you’ve got a couple more minutes</small></span><span class="chev">${svg('chev')}</span></button>`;
}
function todayCard() {
  const d = stepsDone(), fp = PACKS.find(p => p.id === S.focus);
  if (d === 3) return `<div class="card goal-like done-state">
      <div class="big-check">${svg('check')}</div><h4>Done for today</h4>
      <p>13 days in a row. Come back tomorrow for a fresh set.</p>
      <div class="extras"><button class="pill soft" data-act="start">Train 10 more</button><button class="pill soft" data-act="start">Go over the ones I missed</button></div>
      ${bonusRow()}
    </div>`;
  return `<div class="card goal-like">
      <div class="rings">${PLAN.map((p, i) => `
        <div class="ringcell"><div class="ring ${i < d ? 'done' : ''}">${ringSVG(i < d ? 1 : 0)}${i < d ? '<div class="disc"></div>' : ''}<div class="mid">${i < d ? svg('check') : svg(p.k)}</div></div><div><b>${p.name}</b><br>${p.n}</div></div>`).join('')}</div>
      <div class="today-foot">
        <div><div class="big">≈ ${minsLeft()} min</div><div class="muted sm">${d ? `${3 - d} steps left` : '3 steps'} · 🔥 12 days</div>
          ${fp ? `<div class="focus-line"><span class="star">★</span> New from <b>${esc(fp.name)}</b></div>` : ''}</div>
        <button class="pill" data-act="start">${d ? 'Continue' : 'Start'}</button>
      </div>
    </div>`;
}
/* A pack is drawn like a book cover: the app's gradient, spine sheen and serif title. */
function packCover(p, big) {
  const kicker = p.auto ? 'From books' : p.own ? 'Your pack' : 'Ready-made';
  return `<div class="cover pcov ${big ? 'big' : ''}" style="background:linear-gradient(160deg, ${p.col}, color-mix(in srgb, ${p.col} 52%, #000))">
      <div><div class="ce">${esc(p.emoji)}</div><div class="ct">${esc(p.name)}</div></div><div class="ca">${kicker}</div></div>`;
}
function shelfItem(p) {
  const on = packOn(p), total = packTotal(p), learned = packLearned(p);
  return `<button class="book ${on ? '' : 'off'}" data-open="${p.id}">${packCover(p)}
      <div class="bmeta">${S.focus === p.id ? '<span class="tag focus">★ Focus</span>' : ''}${on ? `${learned} of ${total} learned` : `${total} sentences`}</div>
      ${on ? `<div class="hair"><span style="width:${total ? learned / total * 100 : 0}%"></span></div>` : ''}</button>`;
}
function viewTraining() {
  const own = PACKS.filter(p => p.own), on = PACKS.filter(p => !p.own && p.on), off = PACKS.filter(p => !p.own && !p.on);
  return `<div class="view-head"><h1 class="large-title">Training</h1><div class="head-btns"><button class="circle-btn" data-act="settings" aria-label="Training settings">${svg('gear')}</button><button class="circle-btn" data-act="plus" aria-label="New sentence or pack">${svg('plus')}</button></div></div>
    <h2 class="section-title">Today’s Training</h2>
    ${todayCard()}
    <h2 class="section-title">Your Packs <small><button class="see" data-act="newpack">New pack</button></small></h2>
    <div class="shelf">${own.map(shelfItem).join('')}</div>
    <h2 class="section-title">Ready-made</h2>
    <div class="shelf">${on.map(shelfItem).join('')}</div>
    <h2 class="section-title">More to Add</h2>
    <div class="shelf">${off.map(shelfItem).join('')}</div>`;
}

/* ---------- pack page ---------- */
function viewPack(id) {
  const p = PACKS.find(x => x.id === id), list = packSents(id), on = packOn(p), total = packTotal(p), learned = packLearned(p);
  const due = list.filter(s => s.lvl > 0 && s.lvl < 4 && !s.paused).length;
  const rows = list.map(s => `<div class="srow ${s.paused ? 'paused' : ''}">
      <button class="say-btn" data-play="${s.id}" aria-label="Play">${svg('speaker')}</button>
      <button class="txt" data-sent="${s.id}"><div class="it">${esc(gender(s.it))}</div>${S.showEN ? `<div class="en">${esc(s.en)}</div>` : ''}${s.paused ? '<div class="tags">Paused</div>' : s.packs.length > 1 ? `<div class="tags">Also in ${s.packs.filter(x => x !== id).map(x => esc(PACKS.find(q => q.id === x).name)).join(', ')}</div>` : ''}</button>
      ${lvlDots(s)}</div>`).join('');
  const more = !p.own && TOTALS[id] > list.length ? `<div class="srow more">+ ${TOTALS[id] - list.length} more in the real pack</div>` : '';
  return `<div class="nav"><button class="back" data-act="home">${svg('back')} Training</button>
      <button class="circle-btn" data-act="packmenu" aria-label="Pack options">${svg('more')}</button></div>
    <div class="hero-book">${packCover(p, true)}
      <div class="hero-meta"><div class="kicker">${p.auto ? 'From books' : p.own ? 'Your pack' : 'Ready-made'} · ${total} sentences</div>
        <h3>${esc(p.name)}</h3>
        <div class="author">${on ? `${learned} learned · ${due} due soon` : 'Not in your training yet'}${S.focus === id ? ' · <span style="color:var(--gem-ink)">★ Focus</span>' : ''}</div>
        <div class="hero-btns">${on ? `<button class="pill" data-act="trainpack">Train</button><button class="pill soft" data-act="shadowall">${svg('shadow')} Shadow</button>` : `<button class="pill" data-act="enable">Add to my packs</button>`}</div>
      </div></div>
    <div class="list-head"><h2 class="section-title">Sentences</h2>
      <div class="lh-btns"><button class="see" data-act="playall">${svg('play')} Play all</button><button class="see" data-act="eye">${S.showEN ? 'Hide English' : 'Show English'}</button></div></div>
    <div class="plain">${rows}${more}<button class="srow add-row" data-act="addhere">${svg('plus')} Add a sentence</button></div>`;
}

/* ---------- shell ---------- */
const TABS = [
  ['home', 'Home', I.book],
  ['library', 'Library', '<path d="M4 3h3v18H4zM9 3h3v18H9zM14.2 3.6l2.9-.8 4.7 17.4-2.9.8z"/>'],
  ['training', 'Training', '<path d="M3 6a2.5 2.5 0 0 1 2.5-2.5h13A2.5 2.5 0 0 1 21 6v8.5a2.5 2.5 0 0 1-2.5 2.5H11l-5 4.2V17h-.5A2.5 2.5 0 0 1 3 14.5z"/>'],
  ['vocab', 'Vocabulary', '<path d="M5 3h11l3 3v15H5zm3 5v2h8V8zm0 4v2h8v-2zm0 4v2h5v-2z"/>'],
  ['stats', 'Stats', '<path d="M4 20h16v-1.6H4zM5.5 17h3V11h-3zm5 0h3V5h-3zm5 0h3V8.5h-3z"/>'],
];
function render() {

}
function shadowAll(id) {
  const list = packSents(id).filter(s => !s.paused);
  SS.pack = id; SS.bonus = false; STEPS = [{ k: 'shadow', name: 'Shadow all', n: list.length, min: Math.ceil(list.length * .5), what: 'sentences × 3', how: 'Hands-free: each sentence plays, then leaves a gap for you to repeat. Good for a walk.' }];
  DECK.shadowAll = list.map(s => ({ it: gender(s.it), en: s.en }));
  STEPS[0].k = 'shadow'; DECK._shadow = DECK.shadow; DECK.shadow = DECK.shadowAll;
  SS.step = 0; SS.item = -1;
  document.getElementById('session').hidden = false; document.getElementById('proto').hidden = true; drawSession();
}
function nextItem() {
  SS.flipped = false; SS.hint = 0;
  const deck = DECK[STEPS[SS.step].k];
  if (SS.item + 1 < deck.length) SS.item++;
  else { SS.step++; SS.item = -1; if (SS.step >= STEPS.length) return drawEnd(); }
  drawSession();
}
function drawEnd() {
  if (DECK._shadow) { DECK.shadow = DECK._shadow; delete DECK._shadow; }
  const daily = !SS.pack && !SS.bonus;
  document.getElementById('s-inner').innerHTML = `<div class="end">
    <div class="big-check">${svg('check')}</div>
    <h2 style="margin:0;font-size:28px">${daily ? 'Done for today' : SS.bonus ? 'Words done' : 'Pack session done'}</h2><p class="muted" style="margin:0">${daily ? '13 days in a row' : 'Ratings saved. Today’s plan is unchanged.'}</p>
    <div class="tally"><div><b>${daily ? 7 : 3}</b>sentences</div><div><b>${SS.again}</b>to go over</div></div>
    ${daily ? bonusRow() : ''}
    <button class="primary" data-s="finish" style="max-width:340px">Done</button>
    ${daily ? '<button class="linkbtn" data-s="finish">Train 10 more</button><button class="linkbtn" data-s="finish">Go over the ones I missed</button>' : ''}
  </div>`;
}
document.getElementById('session').addEventListener('click', e => {
  const g = e.target.closest('[data-gloss]');
  if (g && SS.flipped) { const k = g.dataset.gloss, box = document.querySelector('.back #gloss') || document.getElementById('gloss'); if (box) box.innerHTML = `<div class="gloss"><b>${esc(k)}</b> · ${GLOSS[k] || '…'}${STATUS[k] === 0 ? '<button>+ Gem</button>' : ''}</div>`; return; }
  const sb = e.target.closest('[data-say]');
  if (sb) return speak(sb.dataset.say, sb.dataset.srate ? +sb.dataset.srate : 1, sb);
  const b = e.target.closest('[data-s],[data-rate],[data-act]'); if (!b) return;
  if (b.dataset.act === 'bonus') { endSession(true); return startSession(null, true); }
  if (b.dataset.rate) { if (b.dataset.rate === '1') SS.again++; return nextItem(); }
  const a = b.dataset.s;
  if (a === 'close') { if (DECK._shadow) { DECK.shadow = DECK._shadow; delete DECK._shadow; } return endSession(false); }
  if (a === 'finish') return endSession(true);
  if (a === 'undo') return toast('Undo: back to the previous card');
  if (a === 'go') { SS.item = 0; return drawSession(); }
  if (a === 'skip') { SS.step++; SS.item = -1; return SS.step >= STEPS.length ? drawEnd() : drawSession(); }
  if (a === 'next') return nextItem();
  if (a === 'again') return runShadow(DECK.shadow[SS.item], 0);
  if (a === 'hint') { if (SS.hint >= 2) { SS.hint = 3; toast('Shown. This one counts as Again.'); return nextItemAfterReveal(); } SS.hint++; return drawSession(); }
  if (a === 'shadow1') return toast('Shadow: plays it 3 times with a pause to repeat');
  if (a === 'flip') { SS.flipped = true; document.querySelector('.flash').classList.add('flipped'); const r = document.querySelector('.rate'); if (r) r.hidden = false;
    const hintEl = document.querySelector('.swipe-hint'); if (hintEl && STEPS[SS.step].k === 'say') hintEl.textContent = SS.hint ? 'You used a hint, so Good and Easy are off for this one.' : 'How close were you? Tap a word to look it up.';
    const c = DECK[STEPS[SS.step].k][SS.item]; if (c.it && STEPS[SS.step].k === 'say') speak(c.it, 1, document.querySelector('.back .tools button')); }
});
function nextItemAfterReveal() {
  SS.flipped = true; drawSession();
  const r = document.querySelector('.rate'); if (r) { r.hidden = false; r.innerHTML = '<button class="again" data-rate="1" style="grid-column:1/-1">Next (counted as Again)</button>'; }
  const c = DECK.say[SS.item]; speak(c.it, 1);
}
function sessionKey(e) {
  if (e.key === ' ') { e.preventDefault(); document.querySelector('[data-s="flip"]')?.click(); }
  if ('1234'.includes(e.key) && SS.flipped) document.querySelector(`[data-rate="${e.key}"]:not(:disabled)`)?.click();
  if (e.key === 'Escape') endSession(false);
}
render();
</script>
